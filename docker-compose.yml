# ─────────────────────────────────────────────
# SERVICES
# Each service becomes one running container
# ─────────────────────────────────────────────
services:

  # ── 1. Neo4j Database ──────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: roadnet_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (Python connects here)
    volumes:
      - ./neo4j/data:/data           # Graph data persists here
      - ./neo4j/logs:/logs           # Log files
      - ./neo4j/conf:/conf           # Config overrides
      - ./neo4j/plugins:/plugins     # GDS plugin lives here
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - roadnet

  # ── 2. Python Ingestion ────────────────────
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: roadnet_ingestion
    volumes:
      - ./data:/data:ro              # Raw dataset (read-only)
      - ./ingestion:/app             # Python source code
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy   # Wait for Neo4j to be ready
    networks:
      - roadnet
    profiles:
      - ingest                       # Only runs when explicitly requested

  # ── 3. Dashboard ───────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: roadnet_dashboard
    ports:
      - "${DASH_PORT}:8050"
    volumes:
      - ./dashboard:/app             # Dashboard source code
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - roadnet
    profiles:
      - dashboard                    # Only runs when explicitly requested

# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:
  roadnet:
    driver: bridge